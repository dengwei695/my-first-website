<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的网页</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 800px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1e90ff;
            text-align: center;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            text-indent: 2em;
        }
        .box {
            border: 2px solid #1e90ff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎来到我的第一个网页</h1>
        <p>这是我使用HTML和CSS制作的网页，已经部署在GitHub Pages上。</p>
        <div class="box">
            <p>通信工程专业，认真学习网页前端基础。</p>
        </div>
    </div>
</body>
</html>
